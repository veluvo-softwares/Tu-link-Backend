name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'packages/ui/**'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'compose.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'packages/ui/**'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'compose.yml'

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tulink
          POSTGRES_PASSWORD: tulink_ci
          POSTGRES_DB: tulink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tulink -d tulink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used by drizzle-kit migrate and any DB-backed tests.
      DATABASE_URL: postgresql://tulink:tulink_ci@localhost:5432/tulink
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: tulink
      POSTGRES_PASSWORD: tulink_ci
      POSTGRES_DB: tulink

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint:check

      - name: Run type check
        run: npm run typecheck

      - name: Apply database migrations
        # Validates that the Drizzle migrations apply cleanly against PostGIS.
        run: npm run db:migrate

      - name: Run tests
        run: npm test
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test

      - name: Run test coverage
        run: npm run test:cov
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        # Gate on critical only: remaining high-severity advisories are
        # transitive deps of firebase-admin / @nestjs whose only npm-audit
        # "fix" is a breaking downgrade. Tracked for a forward-upgrade PR.
        run: npm audit --audit-level critical

      - name: Run vulnerability scan with Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  build:
    name: Build & Docker
    runs-on: ubuntu-latest
    needs: [test, security]
    outputs:
      api-image-tag: ${{ steps.meta-api.outputs.tags }}
      api-image-digest: ${{ steps.build-api.outputs.digest }}
      dashboard-image-tag: ${{ steps.meta-dashboard.outputs.tags }}
      dashboard-image-digest: ${{ steps.build-dashboard.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          platforms: linux/amd64

      - name: Extract dashboard metadata
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/dashboard
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push dashboard image
        id: build-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/dashboard/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
          platforms: linux/amd64

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to droplet
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env*' \
            --exclude='coverage' \
            --exclude='dist' \
            ./ ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/root/tulink-backend/

      - name: Deploy to DigitalOcean Droplet
        run: |
          ssh ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} << 'EOF'
            set -e

            cd /root/tulink-backend

            COMPOSE_FILE=apps/api/config/docker/docker-compose.dev.yml

            # Build the release without replacing the currently healthy services.
            docker compose --env-file .env -f "$COMPOSE_FILE" --profile server build api-dev dashboard-dev

            # Ensure the migration dependencies are healthy, then migrate using
            # the newly built image before switching the API container.
            docker compose --env-file .env -f "$COMPOSE_FILE" --profile server up -d postgres redis

            echo "Applying database migrations..."
            # Disable stdin explicitly: this command runs inside an SSH heredoc,
            # and Compose otherwise consumes the remaining deployment script.
            docker compose --env-file .env -f "$COMPOSE_FILE" --profile server run --rm --no-deps -T --interactive=false -e CI=true api-dev \
              sh -c 'DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB" npm run db:migrate'

            # Only replace application services after every migration has committed.
            docker compose --env-file .env -f "$COMPOSE_FILE" --profile server up -d --no-build --force-recreate --remove-orphans api-dev dashboard-dev

            # Wait for Docker's health checks (ports are internal to the web network).
            for service in api-dev dashboard-dev; do
              echo "Waiting for $service to be healthy..."
              for i in {1..30}; do
                status=$(docker inspect --format='{{.State.Health.Status}}' "$service" 2>/dev/null)
                if [ "$status" = "healthy" ]; then
                  echo "$service is healthy!"
                  break
                fi
                if [ $i -eq 30 ]; then
                  echo "$service health check failed after 30 attempts (last status: $status)"
                  exit 1
                fi
                echo "Attempt $i/30: $service status=$status, waiting 10s..."
                sleep 10
              done
            done

            # Reload Caddy so the reverse proxy drops stale keepalive
            # connections to the previous api-dev container and re-resolves
            # the freshly recreated one (avoids a transient 502 window).
            if docker inspect caddy >/dev/null 2>&1; then
              docker exec caddy caddy reload --config /etc/caddy/Caddyfile
            else
              echo "caddy container not found, skipping reload"
            fi

            # Cleanup dangling images
            docker image prune -f

            echo "Deployment completed successfully!"
          EOF

      - name: Verify deployment
        # Retry the public health check: right after container recreation the
        # proxy may briefly serve a stale upstream, so a single curl is flaky.
        run: |
          for i in {1..12}; do
            if curl -sf --connect-timeout 5 --max-time 10 https://api.dev.tulink.xyz/health; then
              echo "Deployment verification successful!"
              exit 0
            fi
            echo "Attempt $i/12 failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check never passed after 120s"
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to dev successful!"
          else
            echo "❌ Deployment to dev failed!"
          fi
